<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="KioskoPOS - Sistema de ventas para kioscos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KioskoPOS" />
    <link rel="manifest" href="/manifest.json" />
    <title>KioskoPOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Manejo de Service Worker: solo en producción
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // En localhost limpiamos cualquier SW o caché para que no congele el código en desarrollo
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const reg of registrations) {
              reg.unregister()
            }
          })
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) caches.delete(name)
            })
          }
        } else {
          // En producción (ej. Vercel o HTTPS), habilitamos PWA
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(() => console.log('✅ Service Worker registrado para PWA'))
              .catch((err) => console.log('❌ Service Worker error:', err))
          })
        }
      }
    </script>
  </body>
</html>
