<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e2033" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dcd4c4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e2033" />
    <meta name="description" content="AlPaso POS - Sistema ágil de punto de venta y gestión comercial para kioscos y comercios" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AlPaso POS" />
    <meta name="application-name" content="AlPaso POS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>AlPaso POS - Sistema de Ventas y Gestión</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('alpaso-pos-font-size');
          if (saved) document.documentElement.setAttribute('data-font-size', saved);
          var theme = localStorage.getItem('kioskopos-theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var themeColor = isDark ? '#0e2033' : '#dcd4c4';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) { m.setAttribute('content', themeColor); });
        } catch(e) {}
      })();
    </script>
    <script>
      // Funciona incluso si el módulo inicial no llegó a ejecutar React.
      window.addEventListener('error', function(event) {
        if (!event.target || event.target.tagName !== 'SCRIPT' || event.target.type !== 'module') return;
        var root = document.getElementById('root');
        if (!root || root.childElementCount) return;
        var panel = document.createElement('section');
        panel.style.cssText = 'padding:32px;color:#fff;background:#111827;font:16px system-ui;min-height:100vh';
        var message = document.createElement('p');
        message.textContent = 'No se pudo iniciar la aplicación. Revisá la conexión y volvé a intentar. No vuelvas a cobrar una operación pendiente.';
        var button = document.createElement('button');
        button.textContent = 'Reintentar carga';
        button.onclick = function() { window.location.assign(window.location.href); };
        panel.append(message, button);
        root.append(panel);
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script id="app-entry" type="module" src="/src/main.tsx"></script>
    <script>
      // Manejo de Service Worker para PWA y soporte Offline
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Solo en desarrollo activo con Vite dev server (puerto 5173) evitamos registrar SW para no interferir con HMR
          const isViteDev = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port === '5173';
          
          if (isViteDev) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const reg of registrations) reg.unregister();
            });
          } else {
            // En producción, preview o despliegue HTTPS: registrar Service Worker para modo offline y PWA
            // Actualizar el controlador no debe descartar tickets abiertos.
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => {
                console.log('AlPaso POS PWA Service Worker registrado:', reg.scope);
                // Forzar búsqueda inmediata de nueva versión
                reg.update().catch(() => {});
              })
              .catch((err) => {
                console.warn('Error al registrar Service Worker:', err);
              });
          }
        });
      }
    </script>
  </body>
</html>
